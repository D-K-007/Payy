
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Web Pay Gateway</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html5-qrcode scanner library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        #reader__scan_region video { object-fit: cover; border-radius: 1rem; width: 100% !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-purple-950 text-slate-100 min-h-full flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="w-full bg-slate-900/60 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 px-4 py-3 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-md shadow-indigo-500/20">
                <i class="fa-solid fa-qrcode text-white text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">UPI Web Pay</h1>
                <p class="text-xs text-slate-400">Scan & Trigger Payment App</p>
            </div>
        </div>
        <button onclick="openHistoryModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition border border-slate-700 flex items-center space-x-1.5">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>History</span>
        </button>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 w-full max-w-md mx-auto">
        <div class="w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
            <!-- Glow background effect -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Scanner Trigger / Permission Area -->
            <div class="mb-6">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center space-x-1.5">
                        <i class="fa-solid fa-camera text-indigo-400"></i>
                        <span>UPI QR Scanner</span>
                    </label>
                    <span id="scan-status" class="text-xs text-indigo-400 font-medium hidden animate-pulse">Requesting Camera...</span>
                </div>
                
                <div id="scanner-container" class="hidden relative rounded-2xl overflow-hidden border-2 border-indigo-500/50 bg-black mb-3 shadow-inner">
                    <div id="reader" class="w-full"></div>
                    <button onclick="stopScanner()" class="absolute top-3 right-3 z-20 bg-slate-900/80 hover:bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-md transition shadow">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <button id="start-scan-btn" onclick="requestCameraAndStartScan()" class="w-full py-3 px-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-medium text-sm shadow-lg shadow-indigo-600/25 flex items-center justify-center space-x-2 transition transform active:scale-[0.98]">
                    <i class="fa-solid fa-video"></i>
                    <span>Allow Camera & Scan QR</span>
                </button>
            </div>

            <form id="payment-form" onsubmit="handlePay(event)" class="space-y-4">
                <!-- Payee UPI ID (PA) -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 flex items-center justify-between">
                        <span class="flex items-center space-x-1.5"><i class="fa-solid fa-at text-indigo-400"></i><span>Payee UPI ID (pa)</span></span>
                        <span class="text-[10px] text-emerald-400 font-normal" id="verified-tag"></span>
                    </label>
                    <input type="text" id="upi-pa" required placeholder="e.g. merchant@upi" 
                        class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                </div>

                <!-- Payee Name (PN) -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 flex items-center space-x-1.5">
                        <i class="fa-solid fa-user text-indigo-400"></i>
                        <span>Payee Name (pn)</span>
                    </label>
                    <input type="text" id="upi-pn" placeholder="e.g. Merchant Store" 
                        class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                </div>

                <!-- Amount Input Box (AM) -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 flex items-center space-x-1.5">
                        <i class="fa-solid fa-indian-rupee-sign text-indigo-400"></i>
                        <span>Amount (INR)</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500 font-semibold">₹</span>
                        <input type="number" id="upi-am" step="0.01" min="1" required placeholder="0.00" 
                            class="w-full bg-slate-950/60 border border-slate-800 rounded-xl pl-8 pr-4 py-3 text-lg font-bold text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                    </div>
                </div>

                <!-- Description / Note (TN) -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 flex items-center space-x-1.5">
                        <i class="fa-solid fa-note-sticky text-indigo-400"></i>
                        <span>Note / Description (tn)</span>
                    </label>
                    <input type="text" id="upi-tn" placeholder="e.g. Dinner bill / Order #1234" 
                        class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                </div>

                <!-- Quick Templates / Saved UPIs -->
                <div class="pt-1">
                    <p class="text-[11px] text-slate-400 mb-2 font-medium">Quick Templates:</p>
                    <div class="flex flex-wrap gap-2">
                        <button type="button" onclick="loadTemplate('coffee@paytm', 'Coffee Shop', 150, 'Evening Coffee')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700 transition">☕ Coffee Shop</button>
                        <button type="button" onclick="loadTemplate('grocery@ybl', 'SuperMart', 499, 'Groceries')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700 transition">🛒 SuperMart</button>
                        <button type="button" onclick="loadTemplate('cab@oksbi', 'City Rides', 220, 'Cab Ride')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700 transition">🚕 City Rides</button>
                    </div>
                </div>

                <div class="pt-3">
                    <button type="submit" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-bold text-base shadow-xl shadow-emerald-500/20 flex items-center justify-center space-x-2 transition transform active:scale-[0.98]">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>Pay via UPI App</span>
                    </button>
                </div>
            </form>

            <!-- Live UPI URL preview box -->
            <div class="mt-4 pt-4 border-t border-slate-800/80">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-[10px] uppercase font-semibold text-slate-500">Generated UPI Scheme URL:</span>
                    <button type="button" onclick="copyUpiUrl()" class="text-[10px] text-indigo-400 hover:text-indigo-300 font-medium flex items-center space-x-1">
                        <i class="fa-regular fa-copy"></i><span>Copy URL</span>
                    </button>
                </div>
                <div id="url-preview" class="w-full bg-slate-950 p-2.5 rounded-xl text-[11px] font-mono text-slate-400 overflow-x-auto whitespace-nowrap border border-slate-900">
                    upi://pay?pa=...
                </div>
            </div>
        </div>
    </main>

    <div id="history-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-sm p-6 shadow-2xl relative max-h-[80vh] flex flex-col">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                <h3 class="font-bold text-base text-white flex items-center space-x-2">
                    <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i>
                    <span>Recent Payments</span>
                </h3>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-white w-8 h-8 rounded-full flex items-center justify-center bg-slate-800">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="history-list" class="overflow-y-auto space-y-2.5 flex-grow pr-1">
                <div class="text-center py-8 text-slate-500 text-xs">No recent transactions recorded yet.</div>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-800 text-right">
                <button onclick="clearHistory()" class="text-xs text-red-400 hover:text-red-300 font-medium">Clear History</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Banner -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 border border-slate-700 text-slate-200 text-xs px-4 py-2.5 rounded-xl shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center space-x-2">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg">Notification message</span>
    </div>

    <script>
        let html5QrCode = null;
        let isScanning = false;

        // Update URL preview dynamically whenever inputs change
        const paInput = document.getElementById('upi-pa');
        const pnInput = document.getElementById('upi-pn');
        const amInput = document.getElementById('upi-am');
        const tnInput = document.getElementById('upi-tn');
        const urlPreview = document.getElementById('url-preview');

        function updateUpiUrlPreview() {
            const pa = paInput.value.trim();
            const pn = pnInput.value.trim();
            const am = amInput.value.trim();
            const tn = tnInput.value.trim();

            let url = `upi://pay?pa=${encodeURIComponent(pa)}`;
            if (pn) url += `&pn=${encodeURIComponent(pn)}`;
            if (am) url += `&am=${encodeURIComponent(am)}&cu=INR`;
            if (tn) url += `&tn=${encodeURIComponent(tn)}`;

            urlPreview.textContent = url;
        }

        [paInput, pnInput, amInput, tnInput].forEach(input => {
            input.addEventListener('input', updateUpiUrlPreview);
        });

        // Explicitly request camera permission using getUserMedia first, then start scanner
        async function requestCameraAndStartScan() {
            const statusIndicator = document.getElementById('scan-status');
            statusIndicator.classList.remove('hidden');
            statusIndicator.textContent = 'Requesting Camera Permission...';

            try {
                // Explicit permission prompt test
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                
                // If permission granted successfully, release this test stream so html5-qrcode can bind cleanly
                stream.getTracks().forEach(track => track.stop());

                startScanner();
            } catch (err) {
                console.error("Camera permission denied or error:", err);
                statusIndicator.classList.add('hidden');
                
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    showToast("Camera permission denied. Please allow camera access in browser settings.", "error");
                } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                    showToast("No camera device found on this device.", "error");
                } else {
                    showToast("Unable to access camera. Please check permissions.", "error");
                }
            }
        }

        // Initialize QR Scanner
        function startScanner() {
            const container = document.getElementById('scanner-container');
            const scanBtn = document.getElementById('start-scan-btn');
            const statusIndicator = document.getElementById('scan-status');

            container.classList.remove('hidden');
            scanBtn.classList.add('hidden');
            statusIndicator.classList.remove('hidden');
            statusIndicator.textContent = 'Camera Active - Point at QR';

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const qrCodeSuccessCallback = (decodedText, decodedResult) => {
                stopScanner();
                parseUpiQrString(decodedText);
                showToast("UPI QR Scanned successfully!", "success");
            };

            const config = { fps: 10, qrbox: { width: 240, height: 240 } };

            html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback)
                .catch(err => {
                    console.error("Camera start failed:", err);
                    showToast("Failed to start camera stream", "error");
                    stopScanner();
                });
            isScanning = true;
        }

        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                }).catch(err => {
                    console.error("Failed to stop scanner", err);
                });
            }
            document.getElementById('scanner-container').classList.add('hidden');
            document.getElementById('start-scan-btn').classList.remove('hidden');
            document.getElementById('scan-status').classList.add('hidden');
        }

        // Parse Standard UPI URI format (e.g. upi://pay?pa=...&pn=...&am=...)
        function parseUpiQrString(rawText) {
            try {
                let queryString = rawText;
                if (rawText.includes('?')) {
                    queryString = rawText.split('?')[1];
                }
                const urlParams = new URLSearchParams(queryString);

                const pa = urlParams.get('pa');
                const pn = urlParams.get('pn');
                const am = urlParams.get('am');
                const tn = urlParams.get('tn');

                if (pa) {
                    paInput.value = pa;
                    document.getElementById('verified-tag').textContent = '✓ Verified UPI ID';
                }
                if (pn) pnInput.value = decodeURIComponent(pn);
                if (am) amInput.value = am;
                if (tn) tnInput.value = decodeURIComponent(tn);

                updateUpiUrlPreview();
            } catch (e) {
                console.error("Error parsing QR string:", e);
                if (rawText.includes('@')) {
                    paInput.value = rawText.trim();
                    document.getElementById('verified-tag').textContent = '✓ UPI ID Detected';
                    updateUpiUrlPreview();
                } else {
                    showToast("Scanned QR is not a valid UPI code", "error");
                }
            }
        }

        // Quick Templates Loader
        function loadTemplate(pa, pn, am, tn) {
            paInput.value = pa;
            pnInput.value = pn;
            amInput.value = am;
            tnInput.value = tn;
            document.getElementById('verified-tag').textContent = '✓ Template Loaded';
            updateUpiUrlPreview();
            showToast(`Loaded template for ${pn}`, "success");
        }

        // Handle Pay button click: open upi:// link in another tab/window
        function handlePay(e) {
            e.preventDefault();
            const pa = paInput.value.trim();
            const am = amInput.value.trim();

            if (!pa || !am) {
                showToast("Please enter Payee UPI ID and Amount", "error");
                return;
            }

            const paVal = paInput.value.trim();
            const pnVal = pnInput.value.trim();
            const amVal = amInput.value.trim();
            const tnVal = tnInput.value.trim();

            let upiUrl = `upi://pay?pa=${encodeURIComponent(paVal)}`;
            if (pnVal) upiUrl += `&pn=${encodeURIComponent(pnVal)}`;
            upiUrl += `&am=${encodeURIComponent(amVal)}&cu=INR`;
            if (tnVal) upiUrl += `&tn=${encodeURIComponent(tnVal)}`;

            // Save to LocalStorage History
            saveTransaction({ pa: paVal, pn: pnVal || 'Unknown', am: amVal, tn: tnVal || '-', date: new Date().toLocaleString() });

            // Feed upi string to another browser tab like a URL
            const paymentWindow = window.open(upiUrl, '_blank');
            
            if (!paymentWindow) {
                window.location.href = upiUrl;
            } else {
                showToast("Triggered payment app in new tab!", "success");
            }
        }

        // Copy generated URL to clipboard
        function copyUpiUrl() {
            const urlText = urlPreview.textContent;
            const textarea = document.createElement('textarea');
            textarea.value = urlText;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast("UPI URL copied to clipboard!", "success");
            } catch (err) {
                showToast("Failed to copy URL", "error");
            }
            document.body.removeChild(textarea);
        }

        // History Management
        function saveTransaction(tx) {
            let history = JSON.parse(localStorage.getItem('upi_pay_history') || '[]');
            history.unshift(tx);
            if (history.length > 20) history.pop();
            localStorage.setItem('upi_pay_history', JSON.stringify(history));
        }

        function openHistoryModal() {
            const modal = document.getElementById('history-modal');
            const listContainer = document.getElementById('history-list');
            let history = JSON.parse(localStorage.getItem('upi_pay_history') || '[]');

            if (history.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">No recent transactions recorded yet.</div>`;
            } else {
                listContainer.innerHTML = history.map(item => `
                    <div class="bg-slate-950/60 border border-slate-800 p-3 rounded-2xl flex items-center justify-between">
                        <div>
                            <div class="font-semibold text-sm text-white">${item.pn}</div>
                            <div class="text-[11px] text-slate-400 font-mono">${item.pa} • ${item.tn}</div>
                            <div class="text-[10px] text-slate-500 mt-0.5">${item.date}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-emerald-400 text-sm">₹${item.am}</div>
                            <button onclick="loadTemplate('${item.pa}', '${item.pn}', '${item.am}', '${item.tn}'); closeHistoryModal();" class="text-[10px] text-indigo-400 hover:underline mt-1 block">Reuse</button>
                        </div>
                    </div>
                `).join('');
            }
            modal.classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        function clearHistory() {
            localStorage.removeItem('upi_pay_history');
            openHistoryModal();
            showToast("Transaction history cleared", "success");
        }

        // Toast Notification Helper
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = message;
            if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-exclamation text-red-400';
            } else {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            }

            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Initial preview load
        updateUpiUrlPreview();
    </script>
</body>
</html>
